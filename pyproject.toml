[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "loliland-agent"
version = "0.4.0"
description = "Windows AI Copilot for LoliLand: visual advice, human gameplay"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "httpx>=0.28,<0.29",
  "PySide6>=6.8,<7", "mss>=10,<11", "Pillow>=11,<13",
  "sounddevice>=0.5,<0.6", "keyring>=25,<26",
]

[project.optional-dependencies]
local-stt = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "mypy>=1.15,<2", "ruff>=0.11,<1"]

[project.scripts]
loliland-copilot = "loliland_agent.__main__:main"
loliland-agent = "loliland_agent.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["loliland_agent"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[[tool.mypy.overrides]]
module = ["sounddevice", "faster_whisper", "keyring.backends.Windows"]
ignore_missing_imports = true
